<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src data:; base-uri 'none'; form-action 'none'">
<title>@@TITLE@@</title>
<style>
:root{color-scheme:light;--ink:#192d39;--muted:#586c78;--accent:#167068;--line:#d7e2e4;--paper:#fff;--wash:#f1f5f5}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:1rem}body{margin:0;background:var(--wash);color:var(--ink);font:16px/1.65 Georgia,"Times New Roman",serif}a{color:var(--accent);text-underline-offset:3px}button,summary{cursor:pointer}button{font:inherit}header{background:var(--ink);color:white;padding:3rem max(5vw,1.25rem)}header .eyebrow{font:700 .8rem/1.5 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#9bd4ca}h1{font-size:clamp(1.8rem,3vw,3rem);max-width:1100px;line-height:1.2;margin:.8rem 0}header p{max-width:1000px;color:#cddde1}h2,h3,h4,nav,.label,figcaption,th{font-family:system-ui,sans-serif}h2{font-size:1.5rem;line-height:1.3;margin:0 0 1.5rem}h3{font-size:1.1rem;line-height:1.4}h4{font-size:1rem}p{margin:.6rem 0 1rem}.shell{display:grid;grid-template-columns:245px minmax(0,1fr);gap:2rem;max-width:1700px;margin:auto;padding:2rem}nav{position:sticky;top:1rem;align-self:start;max-height:94vh;overflow:auto;font-size:.85rem}nav ol{margin:0;padding-left:1.6rem}nav li{margin:0 0 .85rem}nav a{text-decoration:none}main{min-width:0}section{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:clamp(1.15rem,3vw,2.5rem);margin-bottom:1.5rem;min-width:0}section:target{outline:2px solid #81bcb1;outline-offset:2px}blockquote{border-left:3px solid #8ebcb4;margin:1rem 0;padding:.3rem 1.1rem;background:#f7faf9}.source{display:block;font: .79rem/1.5 system-ui,sans-serif;color:var(--muted);margin:.65rem 0;overflow-wrap:anywhere}.label{font-size:.73rem;text-transform:uppercase;font-weight:700;letter-spacing:.055em;color:var(--muted)}.gap{padding:.85rem 1rem;background:#fff7e8;border-left:3px solid #ba8834}.table-scroll,.math-display{max-width:100%;overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.91rem;margin:1rem 0}th,td{border:1px solid var(--line);padding:.65rem .8rem;text-align:left;vertical-align:top;overflow-wrap:anywhere}th{background:#edf4f3;font-size:.8rem}dt{font-weight:700}dd{margin:0 0 .8rem}.variable-card,.model-card{border-top:2px solid var(--line);padding-top:1rem;margin-top:1.5rem}.equation{padding:1rem;margin:1.25rem 0;background:#f4f8f7;border:1px solid var(--line);border-radius:6px}.math-display{padding:1rem 0;text-align:center;font-size:1.15rem}.math-display math{margin:auto;font-family:"Cambria Math","STIX Two Math",serif}figcaption{font-size:.8rem;color:var(--muted);line-height:1.5}details{margin-top:.8rem;font: .83rem/1.5 system-ui,sans-serif}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#e9eeee;padding:1rem;border-radius:4px;font: .85rem/1.6 Consolas,monospace}.flow{display:flex;flex-wrap:wrap;align-items:center;gap:.65rem;margin:1.2rem 0;font:.9rem/1.45 system-ui,sans-serif}.flow .node{border:1px solid #a3c9c2;background:#f0f8f6;border-radius:5px;padding:.75rem;flex:1 1 150px}.flow .arrow{font-size:1.5rem;color:var(--accent)}.walkthrough{padding-top:1.5rem;margin-top:1.5rem;border-top:2px solid var(--line)}.table-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(250px,1fr);gap:1.5rem;align-items:start}.table-images figure{margin:0 0 1.2rem}.image-zoom{display:block;width:100%;padding:0;background:white;border:1px solid var(--line);border-radius:4px;overflow:hidden}.image-zoom:focus-visible{outline:3px solid var(--accent)}.image-zoom img{display:block;width:100%;height:auto}.table-notes{min-width:0}.table-notes>:first-child{margin-top:0}.image-caption{margin-top:.4rem}.inline-image{max-width:100%;height:auto}.sources{font:.85rem/1.6 system-ui,sans-serif;overflow-wrap:anywhere}.sources li{margin-bottom:1rem}footer{color:var(--muted);font:.8rem/1.6 system-ui,sans-serif;padding:0 2rem 2rem;text-align:center}dialog{width:96vw;height:94vh;max-width:none;max-height:none;margin:auto;padding:0;border:1px solid var(--line);border-radius:8px;background:#e8eeee;color:var(--ink)}dialog::backdrop{background:#12242bd9}.zoom-toolbar{height:64px;display:flex;align-items:center;gap:.8rem;padding:.5rem 1rem;background:white;border-bottom:1px solid var(--line);font: .85rem system-ui,sans-serif}.zoom-toolbar span{flex:1}.zoom-toolbar button{padding:.45rem .8rem;border:1px solid #b9c9cb;border-radius:4px;background:white}.zoom-stage{height:calc(100% - 64px);overflow:auto;padding:1rem;display:flex;align-items:flex-start;justify-content:flex-start}.zoom-stage img{height:auto;max-width:100%;margin:auto;flex-shrink:0}.zoom-stage img.actual{max-width:none;margin:0}.abstract-translation{font-family:"Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif}.tag{display:inline-block;font:.7rem system-ui,sans-serif;background:#e6f1ee;color:#245e55;border-radius:3px;padding:.25rem .45rem;margin-right:.5rem}
@media(max-width:1050px){.shell{grid-template-columns:1fr;padding:1rem;gap:1rem}nav{position:static;max-height:none}nav ol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 1.5rem}.table-layout{grid-template-columns:1fr}.zoom-toolbar{gap:.3rem;padding:.4rem}.zoom-toolbar span{font-size:.75rem}}@media(max-width:500px){nav ol{display:block}header{padding:2rem 1.2rem}section{padding:1rem}.flow .node{flex-basis:75%}.zoom-toolbar button{padding:.4rem}.zoom-toolbar{height:76px}.zoom-stage{height:calc(100% - 76px)}}@media print{body{background:white;font-size:10pt}header{background:white;color:black;padding:0}header p,header .eyebrow{color:#333}.shell{display:block;padding:0}nav,dialog,footer{display:none}section{border:0;padding:1rem 0;margin:0;break-inside:auto}.table-layout{grid-template-columns:1fr}.walkthrough{break-before:page}a{color:inherit}.image-zoom{border:0}details{display:block}.math-display{overflow:visible}}
</style>
</head>
<body>
<header><div class="eyebrow">Accounting &amp; Finance · Research Reading</div><h1>@@TITLE@@</h1><p>@@SUBTITLE@@</p></header>
<div class="shell"><nav aria-label="Report contents"><ol>@@NAV@@</ol></nav><main>@@BODY@@</main></div>
<footer>Source-grounded reading of the supplied article. Unreported replication details remain explicitly identified.</footer>
<dialog id="image-dialog" aria-label="Source image viewer">
<div class="zoom-toolbar"><span id="zoom-label"></span><button id="zoom-size" type="button">Actual size</button><button id="zoom-close" type="button">Close</button></div>
<div class="zoom-stage"><img id="zoom-image" alt=""></div>
</dialog>
<script>
(() => {
  const dialog = document.getElementById('image-dialog');
  const image = document.getElementById('zoom-image');
  const label = document.getElementById('zoom-label');
  const size = document.getElementById('zoom-size');
  document.querySelectorAll('.image-zoom').forEach(button => button.addEventListener('click', () => {
    const source = button.querySelector('img');
    image.src = source.src; image.alt = source.alt; image.classList.remove('actual');
    label.textContent = source.alt; size.textContent = 'Actual size'; dialog.showModal();
  }));
  document.getElementById('zoom-close').addEventListener('click', () => dialog.close());
  size.addEventListener('click', () => { const actual = image.classList.toggle('actual'); size.textContent = actual ? 'Fit to window' : 'Actual size'; });
})();
</script>
</body></html>
